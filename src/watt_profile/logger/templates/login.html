<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="/static/theme.js"></script><link rel="stylesheet" href="/static/logger.css"><title>Logger login</title></head>
<body><header><h1>Logger login</h1><button id="theme-toggle" type="button">Light mode</button></header>{% if error %}<p class="login-error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Username <input name="username" autocomplete="username" required maxlength="64"></label>
<label>Password <input type="password" name="password" autocomplete="current-password" required maxlength="256"></label>
<button type="submit">Log in</button></form></body></html>
