<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="csrf-token" content="{{ csrf }}"><title>Watt Profile Server</title>
{% for style in styles %}<link rel="stylesheet" href="/assets/{{ style }}">{% endfor %}
{% for script in imports %}<link rel="modulepreload" href="/assets/{{ script }}">{% endfor %}
<script type="module" src="/assets/{{ entry }}"></script></head><body><div id="root"></div><noscript>JavaScript is required for the workspace.</noscript>
<!-- Native form contract remains available before the React application starts. -->
<form hidden method="post" action="{{ '/login' if login else '/logout' }}"><input type="hidden" name="csrf" value="{{ csrf }}"></form>
</body></html>
