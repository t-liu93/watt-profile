[build-system]
requires = ["setuptools>=69,<81", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "watt-profile"
version = "0.1.0"
description = "Independent DSMR P1 protocol and data contracts for Watt Profile"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.111,<1",
    "idna>=3.7,<4",
    "httpx>=0.27,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.7,<3",
    "pyserial>=3.5,<4",
    "psycopg[binary]>=3.2,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pip-tools>=7.4,<8",
    "playwright>=1.45,<2",
    "pytest>=8.2,<9",
    "ruff>=0.5,<1",
    "setuptools>=69,<81",
    "wheel>=0.43,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
watt_profile = ["logger/templates/**/*.html", "logger/static/**/*", "logger/storage/migrations/**/*.py", "server/templates/**/*", "server/static/**/*", "server/storage/migrations/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
