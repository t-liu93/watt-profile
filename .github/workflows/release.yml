name: Release images

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
      stable: ${{ steps.version.outputs.stable }}
      source_sha: ${{ steps.source.outputs.value }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release version
        id: version
        run: python scripts/check_release_tag.py "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
      - name: Resolve immutable source commit
        id: source
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  full-checks:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate-tag.outputs.source_sha }}

  build-and-test:
    needs: [validate-tag, full-checks]
    strategy:
      fail-fast: false
      matrix:
        component: [logger, server]
        architecture: [amd64, arm64]
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate-tag.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: checked-frontend
          path: frontend/dist
      - name: Verify and stage the checked frontend without rebuilding
        env:
          FRONTEND_DIGEST: ${{ needs.full-checks.outputs.frontend_digest }}
        run: python scripts/frontend_artifact.py stage --expected "$FRONTEND_DIGEST"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/${{ matrix.component }}/Dockerfile
          platforms: linux/${{ matrix.architecture }}
          build-args: |
            WATT_FRONTEND_DIGEST=${{ needs.full-checks.outputs.frontend_digest }}
          load: true
          push: false
          provenance: false
          tags: watt-profile-${{ matrix.component }}:release-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.validate-tag.outputs.source_sha }}
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.architecture }}
      - name: Smoke test native release image without network or hardware
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.architecture }}
        run: |
          docker run --rm --network none -i --entrypoint python \
            "watt-profile-$COMPONENT:release-$ARCH" - "$COMPONENT" "$ARCH" < scripts/image_smoke.py
      - name: Save exactly the tested image
        env:
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.architecture }}
        run: docker save -o "$RUNNER_TEMP/$COMPONENT-$ARCH.tar" "watt-profile-$COMPONENT:release-$ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-image-${{ matrix.component }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/${{ matrix.component }}-${{ matrix.architecture }}.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [validate-tag, full-checks, build-and-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-image-*
          path: ${{ runner.temp }}/release-images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images and multi-platform manifests
        env:
          IMAGE_TAG: ${{ needs.validate-tag.outputs.image_tag }}
          SOURCE_SHA: ${{ needs.validate-tag.outputs.source_sha }}
          STABLE: ${{ needs.validate-tag.outputs.stable }}
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          for component in logger server; do
            image="ghcr.io/$repository-$component"
            digests=()
            for arch in amd64 arm64; do
              docker load -i "$RUNNER_TEMP/release-images/$component-$arch.tar"
              internal_tag="build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$arch"
              docker tag "watt-profile-$component:release-$arch" "$image:$internal_tag"
              docker push "$image:$internal_tag"
              digest=$(docker buildx imagetools inspect "$image:$internal_tag" --format '{{.Manifest.Digest}}')
              digests+=("$image@$digest")
            done
            tags=(-t "$image:$IMAGE_TAG" -t "$image:sha-$SOURCE_SHA")
            if [[ "$STABLE" == true ]]; then tags+=(-t "$image:latest"); fi
            docker buildx imagetools create "${tags[@]}" "${digests[@]}"
            docker buildx imagetools inspect "$image:$IMAGE_TAG"
            echo "Published $image:$IMAGE_TAG (linux/amd64, linux/arm64), source $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          done
