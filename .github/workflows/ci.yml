name: CI

on:
  push:
    branches: ['**']
    # Version tags use this same CI through the release workflow before building.
    tags: ['**', '!v*']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Install Chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/watt-chromium
        run: python -m playwright install --with-deps chromium
      - name: Run lint, unit, database, browser and Compose acceptance
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/watt-chromium
        run: bash scripts/ci.sh
